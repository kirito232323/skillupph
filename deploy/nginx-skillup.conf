# /etc/nginx/sites-available/skillup
#
# Reverse proxy for SkillUp. Serves /static and /media straight from disk,
# forwards everything else to Gunicorn over a unix socket.
#
# Install:
#   sudo cp nginx-skillup.conf /etc/nginx/sites-available/skillup
#   sudo ln -sf /etc/nginx/sites-available/skillup /etc/nginx/sites-enabled/skillup
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;              # replace with your domain once you have one

    # Lesson videos / ID scans can be up to 250 MB (see settings.py).
    # nginx defaults to 1 MB and would answer 413 before Django sees the file.
    client_max_body_size 260m;
    client_body_timeout 300s;

    access_log /var/log/nginx/skillup-access.log;
    error_log  /var/log/nginx/skillup-error.log;

    # --- static files produced by collectstatic -----------------------------
    location /static/ {
        alias /var/www/skillup/staticfiles/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # --- encrypted ID documents: never serve raw ----------------------------
    # These files are ciphertext and are only read through Django views.
    location ^~ /media/id_documents/ { deny all; }
    location ^~ /media/temp_ids/     { deny all; }

    # --- user uploads (logos, avatars, certificates, videos) ----------------
    location /media/ {
        alias /var/www/skillup/media/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- everything else goes to Gunicorn -----------------------------------
    location / {
        proxy_pass http://unix:/run/skillup/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # large uploads must not be buffered whole or timing out mid-transfer
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
